name: Update shipment progress

on:
  schedule:
    # Runs weekdays at 11:00 UTC = 7am Eastern Daylight Time (UTC-4).
    # GitHub Actions cron is fixed UTC and does not adjust for DST, so this
    # drifts to 6am Eastern Standard Time (UTC-5) roughly Nov-Mar.
    # Adjust the cron expression to change frequency — https://crontab.guru
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run update script
        run: python3 update_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Automated shipment progress update"
            git push
          fi
