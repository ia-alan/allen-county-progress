name: Update shipment progress

on:
  schedule:
    # Runs daily at 13:00 UTC (9am ET / 6am PT). Adjust the cron expression
    # to change frequency — https://crontab.guru is handy for this.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run update script
        run: python3 update_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Automated shipment progress update"
            git push
          fi
